<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen " id="start-screen">
           <h1> Quiz Time!</h1>
            <p> Are you a Football Fan? <br> Test your knowledge with these questions!</p>
            <button id="start-btn"> Start Quiz</button>

        </div>
        <div class="screen active " id="quiz-screen">
            <div class="quiz-header">
                <h2 id="Question-text"> Who was the captain of Real Madrid in the 2006/07 season</h2>
                <div class="quiz-info">
                    <p> Question <span id="current-question"> 1 </span> of <span id="total-questions"> 5</span>
                    <p>Score: <span id="score"> 0 </span></p>
                </div>
            </div>
            <div id="answers-container" class="answers-container">
                Sergio Ramos
            </div>
             <div id="answers-container" class="answers-container">
                Raul Gonzalez
            </div>
             <div id="answers-container" class="answers-container">
                Cristiano Ronaldo
            </div>
             <div id="answers-container" class="answers-container">
                Iker Casillas
            </div>
            <div class="progress-bar"> 
                <div id="progress" class="progress"></div>
            </div>
            <button id="start-btn"> Next Question</button>
            
        </div>
        <div id="result-screen " class="screen">
            <h1> Quiz Results</h1>
            <div class="result-info">
                <p> You scored <span id="final-score"> o </span> out of <span id="max-score"> 5 </span></p>
                <div id="result-message"> Good Job! </div>
                <button id="restart-btn"> Restart Quiz </button>
            </div>

        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
